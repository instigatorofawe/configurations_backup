# Starship configuration equivalent to PS1="(%*) %n:%~ $ "
add_newline = false

format = """
$time\
$directory\
$git_branch\
$git_status\
$cmd_duration\
\\$ 
"""

[time]
disabled = false
format = '[\($time\) ]($style)'
style = 'yellow'
time_format = '%H:%M:%S'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'white'
style_root = 'white'

[directory]
format = '[$path ]($style)'
style = 'blue'
truncation_length = 0
truncate_to_repo = true

[git_branch]
format = '[$symbol$branch(:$remote_branch) ]($style)'
symbol = ''

[cmd_duration]
format = '[$duration ]($style)'
min_time = 0
show_milliseconds = true
